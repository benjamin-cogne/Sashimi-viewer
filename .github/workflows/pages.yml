# Publishes the built viewer on GitHub Pages at https://<owner>.github.io/Sashimi-viewer/
# Requires once, in the repository settings: Pages → Build and deployment → Source: "GitHub Actions".
# Delete this file if you do not want a public URL (the page itself never uploads any data: BAM/CRAM
# files are read locally in the browser, but the hospital proxy still has to reach github.io).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
