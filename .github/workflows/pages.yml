# Publishes the viewer on GitHub Pages (Settings → Pages → Source: "GitHub Actions"):
#   https://<owner>.github.io/Sashimi-viewer/       stable build of `main`
#   https://<owner>.github.io/Sashimi-viewer/dev/   unreleased build of `dev`, with a DEV MODE banner (unlisted)
# A push to either branch republishes both, so the stable URL never carries dev code. The dev part is
# skipped when the `dev` branch does not exist. The page itself never uploads any data.
name: pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ---- stable: main ----
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: stable/.nvmrc
          cache: npm
          cache-dependency-path: stable/package-lock.json
      - name: Build the stable viewer (main)
        working-directory: stable
        run: npm ci && npm run build
      - name: Assemble the site
        run: |
          mkdir -p site
          cp stable/dist/index.html site/index.html
          cp stable/dist/sashimi-viewer.html site/sashimi-viewer.html
      # ---- unreleased: dev (if the branch exists) ----
      - name: Does a dev branch exist?
        id: dev
        working-directory: stable
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.dev.outputs.exists == 'true'
        with:
          ref: dev
          path: dev
      - name: Build the dev viewer (dev) with the DEV MODE banner
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev
        env:
          VITE_DEV_MODE: '1'
          VITE_DEV_BRANCH: dev
          VITE_STABLE_URL: ../
        run: |
          export VITE_DEV_SHA="$(git rev-parse HEAD)"
          export VITE_DEV_DATE="$(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          npm ci && npm run build
          mkdir -p ../site/dev
          cp dist/index.html ../site/dev/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
