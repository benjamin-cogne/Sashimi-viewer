    <script>
      // Plain script (no modules): surfaces problems instead of a blank page — a browser that cannot run
      // the viewer, the unbuilt development entry opened by mistake, or a runtime error.
      (function () {
        function show(msg, isError) {
          var box = document.getElementById('sashimi-fallback');
          if (!box) return;
          box.style.display = 'block';
          var p = document.createElement('div');
          p.style.cssText = 'margin-top:8px;padding:8px 10px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;background:' + (isError ? '#fee2e2;color:#991b1b' : '#fef3c7;color:#92400e');
          p.textContent = msg;
          box.appendChild(p);
        }
        window.addEventListener('error', function (e) { show('Error: ' + (e.message || e.type) + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''), true); });
        window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), true); });
        window.addEventListener('DOMContentLoaded', function () {
          // Served unbuilt from a web server (GitHub Pages 'Deploy from a branch' publishes the repository
          // root as is): forward to the built viewer that sits next to this file. Not on the Vite dev
          // server, where main.tsx is served and mounts the app.
          var unbuilt = !!document.querySelector('script[src*="main.tsx"]');
          var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
          if (unbuilt && /^https?:$/.test(location.protocol) && !local) {
            location.replace('sashimi-viewer.html' + location.search + location.hash);
            return;
          }
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              var dev = !!document.querySelector('script[src*="main.tsx"]');
              show(dev
                ? 'This file is the development entry (index.html) and cannot run on its own.\nUse the built file sashimi-viewer.html from the repository (or run: npm run build).'
                : 'The viewer did not start. It needs a current browser (Microsoft Edge, Google Chrome or Firefox) with JavaScript enabled.\nIf this page was opened in Internet Explorer or a very old browser, open it with Edge or Chrome instead.', false);
            }
          }, 2500);
        });
      })();
    </script>
